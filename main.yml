---
- hosts: all
  become: true

  pre_tasks:
    - name: Update package cache and install updates
      ansible.builtin.apt:
        update_cache: yes
        upgrade: full
        cache_valid_time: 43200
        force_apt_get: True
      when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

  tasks:
    - name: Skip if OS not supported
      ansible.builtin.meta: end_host
      when: ansible_facts['distribution'] not in ['Debian', 'Ubuntu']

    - ansible.builtin.import_tasks: install-app.yml
